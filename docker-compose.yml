    # ============================================
# Plantitask - Full Stack Docker Compose
# ============================================
# Usage:
#   1. Copy .env.example to .env and fill in secrets
#   2. docker compose up -d
#   3. Run certbot for SSL (see README)

services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PlantitaskDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # Only expose to localhost, not internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --port 6391
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6391:6391"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6391", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- ASP.NET Core API ----
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-PlantitaskDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__RedisConnection: "redis:6391,password=${REDIS_PASSWORD:-redispass},abortConnect=false"
      ConnectionStrings__HangfireConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-PlantitaskDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"

      # JWT
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JwtSettings__Issuer: PlantitaskApi
      JwtSettings__Audience: PlantitaskClient
      JwtSettings__AccessTokenExpiryInMinutes: 60
      JwtSettings__RefreshTokenExpiryDays: 7

      # App
      App__FrontendUrl: "https://plantitask.com"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"

      # Email (SendGrid)
      EmailSettings__SendGridApiKey: ${SENDGRID_API_KEY:-}
      EmailSettings__FromEmail: "noreply@plantitask.com"
      EmailSettings__FromName: "Plantitask"

      # PayPal
      PayPal__ClientId: ${PAYPAL_CLIENT_ID:-}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET:-}
      PayPal__BaseUrl: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PayPal__OneTimePrice: 4.99
      PayPal__Currency: USD

      # File Storage
      FileStorage__Provider: "Local"
      FileStorage__LocalStorage__BasePath: "/app/uploads"
      FileStorage__LocalStorage__BaseUrl: "https://plantitask.com/files"
      FileStorage__MaxFileSizeInMB: 10
    volumes:
      - uploads-data:/app/uploads
    expose:
      - "8080"

  # ---- Blazor WASM Frontend ----
  web:
    build:
      context: .
      dockerfile: deployment/Dockerfile.web
    restart: unless-stopped
    expose:
      - "80"

  # ---- Nginx Reverse Proxy (SSL termination) ----
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/origin-cert.pem:/etc/nginx/ssl/origin-cert.pem:ro
      - ./deployment/origin-key.pem:/etc/nginx/ssl/origin-key.pem:r      
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Certbot (SSL certificate manager) ----
  certbot:
    image: certbot/certbot
    volumes:
      - letsencrypt-data:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Run once, then use cron/scheduled task for renewal
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew; done'"

volumes:
  postgres-data:
  redis-data:
  uploads-data:
  letsencrypt-data:
  certbot-webroot:
