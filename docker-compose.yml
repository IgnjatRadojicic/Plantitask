# ============================================
# Plantitask - Full Stack Docker Compose
# ============================================

services:
  # ---- PostgreSQL 16 ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-PlantitaskDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis 7 ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --port 6391
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6391:6391"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6391", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- ASP.NET Core API ----
  api:
    build:
      context: .
      dockerfile: deployment/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-PlantitaskDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__RedisConnection: "redis:6391,password=${REDIS_PASSWORD:-redispass},abortConnect=false"
      ConnectionStrings__HangfireConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-PlantitaskDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}"
      Google__ClientId: "252462466539-0v4ssocvbqpml1m9m2nmqvoobgh2s0m2.apps.googleusercontent.com"
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      JwtSettings__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JwtSettings__Issuer: PlantitaskApi
      JwtSettings__Audience: PlantitaskClient
      JwtSettings__AccessTokenExpiryInMinutes: 15
      JwtSettings__RefreshTokenExpiryInDays: 7
      App__FrontendUrl: "https://plantitask.com"
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      EmailSettings__Provider: "Smtp"
      EmailSettings__SendGridApiKey: ${SENDGRID_API_KEY:-}
      EmailSettings__FromEmail: "noreply@plantitask.com"
      EmailSettings__FromName: "Plantitask"
      Smtp__Host: "smtp.resend.com"
      Smtp__Port: 587
      Smtp__UserName: "resend"
      Smtp__Password: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
      Smtp__UseStartTls: true
      PayPal__ClientId: ${PAYPAL_CLIENT_ID:-}
      PayPal__ClientSecret: ${PAYPAL_CLIENT_SECRET:-}
      PayPal__BaseUrl: ${PAYPAL_BASE_URL:-https://api-m.sandbox.paypal.com}
      PayPal__OneTimePrice: 4.99
      PayPal__Currency: USD
      FileStorage__Provider: "Local"
      FileStorage__LocalStorage__BasePath: "/app/uploads"
      FileStorage__LocalStorage__BaseUrl: "https://plantitask.com/files"
      FileStorage__MaxFileSizeInMB: 5
      # Required: FileStorageSettings is ValidateOnStart, so a missing/empty list
      # fails startup. Every entry must have a magic-byte signature in FileUploadRules.
      FileStorage__AllowedExtensions__0: ".png"
      FileStorage__AllowedExtensions__1: ".jpg"
      FileStorage__AllowedExtensions__2: ".jpeg"
      FileStorage__AllowedExtensions__3: ".gif"
      FileStorage__AllowedExtensions__4: ".webp"
      FileStorage__AllowedExtensions__5: ".pdf"
      FileStorage__AllowedExtensions__6: ".zip"
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "8080:8080"

  # ---- Blazor WASM Frontend ----
  web:
    build:
      context: .
      dockerfile: deployment/Dockerfile.web
    restart: unless-stopped
    ports:
      - "3001:80"

volumes:
  postgres-data:
  redis-data:
  uploads-data:
