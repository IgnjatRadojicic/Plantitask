name: Deploy Plantitask

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          cd /home/dragonshield/Plantitask/Plantitask
          docker compose down
          docker compose up -d --build
