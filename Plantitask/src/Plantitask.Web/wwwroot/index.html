<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantitask</title>
    <meta name="description" content="Task management for small teams who plant trees. Kanban boards, real-time collaboration, and a portion of all revenue planting real trees." />
    <base href="/" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <!-- LCP is the landing hero. Blazor only paints it after the WASM runtime boots,
         so preload it here where the parser finds it immediately. The media queries
         mirror the breakpoint in css/landing.css — keep the two in sync. -->
    <link rel="preload" as="image" href="images/landing.webp" type="image/webp"
          media="(min-width: 901px)" fetchpriority="high" />
    <link rel="preload" as="image" href="images/landing-960.webp" type="image/webp"
          media="(max-width: 900px)" fetchpriority="high" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

    <!-- Was one link to css/app.css, which @import-ed these 14. That cost an extra
         serialized round trip on the critical path: app.css had to arrive and parse
         before the browser learned the real stylesheets existed. Listed here they
         download in parallel. Order is identical to the old @import order, so the
         cascade is unchanged. Add new stylesheets HERE, not to app.css.

         ?v= is a manual cache buster. Unlike _framework, .NET does not fingerprint
         our own css/js, so the URL never changes when the contents do. index.html is
         served no-cache, so bumping this number is what forces returning visitors off
         a stale stylesheet. Bump it whenever a css or js file changes shape enough
         that old markup + new styles (or the reverse) would look broken. -->
    <link href="css/_variables.css?v=2" rel="stylesheet" />
    <link href="css/_base.css?v=2" rel="stylesheet" />
    <link href="css/dark-mode-fixes.css?v=2" rel="stylesheet" />
    <link href="css/landing.css?v=2" rel="stylesheet" />
    <link href="css/landingsubpages.css?v=2" rel="stylesheet" />
    <link href="css/auth.css?v=2" rel="stylesheet" />
    <link href="css/legal.css?v=2" rel="stylesheet" />
    <link href="css/notification-panel.css?v=2" rel="stylesheet" />
    <link href="css/settings.css?v=2" rel="stylesheet" />
    <link href="css/field.css?v=2" rel="stylesheet" />
    <link href="css/kanban.css?v=2" rel="stylesheet" />
    <link href="css/groupstatistics.css?v=2" rel="stylesheet" />
    <link href="css/membermanagment.css?v=2" rel="stylesheet" />
    <link href="css/dashboard.css?v=2" rel="stylesheet" />
    <script>
    (function() {
        var t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
    })();
</script>
    <style>

        .loading-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #fafafa;
            overflow: hidden;
            user-select: none;
        }

        .loading-logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0;
            animation: fade-up 0.7s ease-out 0.1s forwards;
        }

        .loading-brand {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 28px;
            color: #9CC103;
            letter-spacing: 3px;
            margin-bottom: 32px;
            opacity: 0;
            animation: fade-up 0.7s ease-out 0.3s forwards;
        }

        .line-container {
            width: 200px;
            height: 3px;
            border-radius: 3px;
            background: #e8e8e8;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
            opacity: 0;
            animation: fade-in 0.5s ease-out 0.6s forwards;
        }

        .line-glow {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 60px;
            border-radius: 3px;
            background: linear-gradient(90deg, transparent, #9CC103, #b8d940, #9CC103, transparent);
            animation: line-sweep 1.8s ease-in-out 0.8s infinite;
            transform: translateX(-60px);
        }

        .loading-text {
            font-family: 'DM Sans', sans-serif;
            color: #999;
            font-size: 13px;
            letter-spacing: 0.3px;
            opacity: 0;
            animation: fade-in 0.5s ease-out 0.8s forwards;
        }

        .loading-dots::after {
            content: '';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes fade-up {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fade-in {
            to {
                opacity: 1;
            }
        }

        @keyframes line-sweep {
            0% {
                transform: translateX(-60px);
            }

            100% {
                transform: translateX(200px);
            }
        }

        @keyframes dots {
            0% {
                content: '';
            }

            25% {
                content: '.';
            }

            50% {
                content: '..';
            }

            75% {
                content: '...';
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="loading-screen">
            <img src="images/logo.png" alt="" width="80" height="80" class="loading-logo" />
            <div class="loading-brand">PLANTITASK</div>
            <div class="line-container">
                <div class="line-glow"></div>
            </div>
            <p class="loading-text">Loading<span class="loading-dots"></span></p>
        </div>
    </div>
    <!-- Everything below is deferred: none of it is touched until a component calls
         into it via JS interop, which cannot happen before the WASM runtime boots.
         Deferring keeps them off the parser's path and out of the `load` event.
         Pixi (~450 KB) and Chart.js (~200 KB) are still downloaded on every page
         including this one, which needs neither — see docs/rewrite/frontend/05-js-interop.md. -->
    <script defer src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script defer src="js/googleAuth.js?v=2"></script>

    <script defer src="js/darkmode.js?v=2"></script>
    <script defer src="js/dom-helpers.js?v=2"></script>
    <script defer src="js/file-download.js?v=2"></script>
    <script defer src="js/field-engine.js?v=2"></script>
    <script defer src="js/scroll-watcher.js?v=2"></script>
    <script defer src="js/dashboard-chart.js?v=2"></script>
    <script defer src="js/group-stats.js?v=2"></script>
    <script defer src="js/kanban-drag.js?v=2"></script>

    <script src="_framework/blazor.webassembly.js"></script>

</body>
</html>
