server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM needs all routes to fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(dll|wasm|dat|blat|js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for index.html and blazor boot json
    location ~* (index\.html|blazor\.boot\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Gzip compression for Blazor
    gzip on;
    gzip_types application/wasm application/octet-stream application/javascript text/css text/html application/json;
    gzip_min_length 256;
}
