server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Must stay above FileStorage:MaxFileSizeInMB or uploads die here with a bare 413
    # that the frontend cannot parse. Nginx defaults to 1M.
    client_max_body_size 6M;

    # Proxy API calls to the API container internally
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blazor WASM needs all routes to fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Caching ----
    # nginx tries regex locations in file order and takes the first match,
    # so these three blocks must stay in this order.

    # 1. Entry points. Must never be cached or the app pins itself to an old build.
    location ~* (index\.html|blazor\.boot\.json)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 2. Framework assets. .NET fingerprints these (dotnet.native.zw8ib5pvmp.wasm),
    #    so the URL changes whenever the bytes do and immutable is genuinely safe.
    location ~* ^/_framework/.*\.(wasm|dll|dat|blat|js|json)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 3. Our own assets. These keep stable filenames forever, so `immutable` was a
    #    trap: edit landing.css and returning visitors keep the old copy for the
    #    full TTL while index.html and the .wasm update, leaving markup and styles
    #    out of sync. Cache them, but make them revalidate.
    location ~* \.(css|js|png|jpg|jpeg|webp|avif|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # ---- Compression ----
    # `dotnet publish` already writes a .br and .gz next to every framework file,
    # compressed offline at maximum level. Serving those costs zero CPU per request.
    # Measured on the current publish output:
    #   raw 13.2 MB   ->   .gz 5.02 MB   ->   .br 3.97 MB
    # Without gzip_static nginx ignored all of it and recompressed at level 1 per visitor.
    gzip_static on;

    # brotli_static is NOT enabled here: ngx_brotli is not in nginx:alpine, and an
    # unknown directive makes nginx refuse to start. See deployment/Dockerfile.web
    # for the module build if you want the extra ~1 MB.

    # Fallback for responses with no precompressed twin (API proxy, generated JSON).
    gzip on;
    gzip_comp_level 5;
    gzip_types application/wasm application/octet-stream application/javascript text/css text/html application/json;
    gzip_min_length 256;
    gzip_vary on;
}
